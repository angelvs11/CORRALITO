[alembic]
script_location = alembic
prepend_sys_path = .

# La URL de la BD se toma de app/core/config.py (ver alembic/env.py)

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
